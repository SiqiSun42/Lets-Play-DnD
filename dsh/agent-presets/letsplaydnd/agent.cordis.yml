# LetsPlayDnD 的 agent preset：极简工具面（spec.md §6 P3）
#
# 为什么工具面在这里而不在 profile patch 里：web 组合（@deepseek-ai/dsh-web-app）
# 把 host 平面的工具行**全部禁用**，改由 agent preset 提供。所以在 profile patch
# 里写 `disabled: true` 是 no-op，真正决定工具面的是这份文件。
#
# 只给两类能力：
#   1. 文件读写 —— tool-fs（read / write / edit）+ list-dir（list_dir，列目录）
#   2. 技能加载 —— skill-filesystem + tool-skill
# 规则检索（search_rules）与骰子（roll_dice）由 host 平面的 MCP 行提供，
# 注册进 host 的 tools 注册表，preset 不需要再挂。
#
# 刻意不挂：shell（bash / pwsh）、后台任务、文件搜索、子代理、工作流、
# todo、goal、ralph、web、plan mode。
# 最小工具面是「工具级读围栏完备」的前提（spec §8 约束 1）——没有 shell，
# read 就是唯一的读路径，路径级围栏才成立。

# ── 身份 ──────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are a Dungeon Master assistant for a D&D 5e play-by-chat game.
      Reply with the player-facing result only; keep planning and tool work in your
      reasoning, and never open a reply with a 'Let me…' / "I'll start by…" preamble.
    suffix: Your working directory is {{cwd}}.

# ── 文件 ──────────────────────────────────────────────────────────

# 唯一的文件能力，也是唯一的变更通道。
# 写围栏由 host 平面的 sandbox-policy 决定（workspace-write），
# 可写根 = 会话的 cwd = 存档目录。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# 列目录。read 喂目录会报 FS_NOT_REGULAR_FILE，DSH 没有官方插件把"列目录"交给模型
# （tool-fs-search 的 glob 也能列，但要额外挂一个不受沙箱约束的子进程后端去 spawn rg，
# 而且 grep 是内容通道）。本插件只列文件名、不读内容，根固定为会话 cwd，
# 模型只能传相对路径——与 fs-readguard 的读白名单同一个圈。见 dsh/plugins/tool-list-dir/README.md。
- id: tool-list-dir
  name: dsh-tool-list-dir

# ── 技能 ──────────────────────────────────────────────────────────

# skill 注册表是 host + per-scope 分层的：这里的行注册进本 preset 的层。
# customSkillDirs 指向项目的 Skills/，与全局注册的 provider 合并成模型看到的目录。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      # 优先取显式环境变量；否则回退到「启动目录 + /Skills」。
      # 生产与本地的启动命令都是 `cd <项目根> && dsh ...`，所以这个回退两边都成立；
      # 不能写死 /opt/letsplaydnd —— 本地那个路径不存在，会扫不到任何 skill，
      # 模型拿不到技能目录，也就不会去加载 consult（这个坑踩过一次）。
      - !!js process.env.DSH_SKILLS_DIR ?? (process.cwd() + '/Skills')

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 读围栏（spec §6 P5-1）─────────────────────────────────────────
# DSH 的沙箱只管**写**：三个模式（read-only / workspace-write / danger-full-access）
# 都是关于写的，"read-only" 指的是"拒绝写"，不是"拒绝读"。任何一层都没有读路径规则。
# 所以模型能 read .env、~/.dsh/.credentials.yaml、/proc/self/environ。
#
# 本插件补上那条缺失的规则：read / read_image 只允许读白名单内的路径。
# 用 ctx.tools.guard()（单调守卫，拒绝后无法被翻案），而不是 fs 后端——
# 不动 ctx.fs 的装配，摘掉即回到原状态。
#
# ⚠️ 它成立的前提是**预设内没有可执行代码**（无 shell / pwsh / 带 shell 的 subagent）。
# 没有 shell，read 就是唯一的读路径，路径级围栏才完备。一旦引入 shell，本插件静默失效。
# 见 dsh/plugins/fs-readguard/README.md。
- id: fs-readguard
  name: dsh-fs-readguard
  config:
    # 额外的读根。会话工作区（agent.session.header.cwd = Account/<用户名>）
    # 由插件自动放行，不写在这里——它由 Flask 按用户设定，写死会圈错地方。
    readRoots:
      # 必需，不能漏：Skills/consult-zh（及 consult-en）/SKILL.md 要求模型「用 read 工具读取对应文件」，
      # 不给它读 consult 直接跑不动。用与上面 skill-filesystem 相同的回退表达式，
      # 避免两处各写一份而漂移。
      - !!js process.env.DSH_SKILLS_DIR ?? (process.cwd() + '/Skills')
    # 刻意不列 Templates/：模板由 Flask 侧在「开局」阶段复制成存档，模型没有读写必要。
    # 未列入即不可读，不需要为它写任何"禁止"规则——这正是白名单相对黑名单的好处。

# ── 上下文压缩 ────────────────────────────────────────────────────
# 不是模型可见的工具，是长会话的必需 housekeeping。
# 不挂它，上下文会随回合无限增长，最终模型调用直接失败——
# 旧系统是靠 `history[-20:]` 手动截断回避这个问题的。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
