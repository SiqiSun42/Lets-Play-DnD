<!DOCTYPE html>
<!-- 语言和色调主题 -->
<html lang="zh-CN" data-color-theme="stars"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LetsPlayDnD</title>
  <link rel="stylesheet" href="css/markdown.css">
  <link rel="stylesheet" href="css/index.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/top-bar.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/account-menu.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <button class="sidebar-title" id="btn-home" type="button">Let's Play DnD</button>
        <button class="sidebar-collapse" id="btn-collapse" type="button">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <rect x="1" y="2" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <line x1="6" y1="2" x2="6" y2="16" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <section class="nav-section">
          <div class="section-header">
            <span class="nav-icon">+</span>
            <span class="section-title" data-i18n="newAdventure">新的冒险</span>
          </div>
          <button class="nav-item nav-sub" id="btn-from-scratch" type="button">
            <span class="nav-icon nav-icon-sm">□</span>
            <span class="nav-label" data-i18n="fromScratch">从零开始</span>
          </button>
          <button class="nav-item nav-sub" id="btn-templates" type="button">
            <span class="nav-icon nav-icon-sm">★</span>
            <span class="nav-label" data-i18n="templates">现有模板</span>
          </button>
        </section>

        <section class="nav-section saves-section">
          <div class="section-header">
            <span class="nav-icon nav-icon-sm">📁</span>
            <span class="section-title" data-i18n="gameSaves">游戏存档</span>
          </div>
          <div class="search-box">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input type="search" id="save-search" placeholder="搜索存档..." data-i18n-placeholder="searchSaves" autocomplete="off">
          </div>
          <ul class="save-list" id="save-list"></ul>
        </section>
      </nav>

      <div class="sidebar-footer">
        <div class="save-item consult-item">
          <div class="save-item-row consult-item-row">
            <button class="nav-item consult-btn" id="btn-consult" type="button">
              <span class="nav-icon">?</span>
              <span class="nav-label" data-i18n="consult">咨询城主</span>
            </button>
            <button type="button" class="save-menu-btn consult-clear-btn" id="btn-consult-clear" aria-label="清除对话记录" data-i18n-aria="clearConsultRecord">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 2l4 4-12 12H6v-4L18 2z"></path>
                <path d="M2 22h8"></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="footer-row">
          <div class="save-item account-item">
            <div class="save-item-row account-item-row">
              <button class="save-item-btn account-btn" id="btn-account" type="button">
                <span class="avatar" id="avatar"></span>
                <span class="nav-label" id="account-label"></span>
              </button>
              <button type="button" class="save-menu-btn account-menu-btn" id="btn-account-options" aria-label="账户选项" data-i18n-aria="accountOptions">⋮</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主内容区域 -->
    <main class="main-content" id="main-content">
      <div class="main-view">
        <div class="top-bar top-bar--simple" id="top-bar">
          <div class="top-bar-left">
            <span class="top-bar-title" id="view-title"></span>
          </div>
          <div class="top-bar-right">
            <button type="button" class="top-bar-btn" id="btn-note">
              <span class="top-bar-btn-icon">📝</span>
              <span class="top-bar-btn-label" data-i18n="notes">笔记</span>
            </button>
            <button type="button" class="top-bar-btn" id="btn-settings">
              <span class="top-bar-btn-icon">⚙</span>
              <span class="top-bar-btn-label" data-i18n="settings">设置</span>
            </button>
          </div>
        </div>
    
        <div class="view-body" id="view-body">
        </div>
      </div>
    </main>
  </div>

  <!-- 弹窗区域 -->
  <div class="panel-overlay hidden" id="panel-overlay">
    <div class="panel-box" id="panel-box" role="dialog" aria-modal="true">
      <button type="button" class="panel-close" id="btn-panel-close" aria-label="关闭" data-i18n-aria="close">×</button>
    
      <div class="panel-layout">
        <aside class="panel-sidebar" id="panel-sidebar">
          <div class="panel-search-box">
            <span class="panel-search-icon" aria-hidden="true">🔍</span>
            <input
              type="search"
              id="panel-sidebar-search"
              placeholder="搜索设置..." data-i18n-placeholder="searchSettings"
              autocomplete="off"
            >
          </div>
        
          <nav class="panel-sidebar-nav" id="panel-sidebar-nav">
            <!-- 以后填条目 -->
          </nav>
        </aside>
    
        <div class="panel-main">
          <div class="panel-content hidden" id="panel-settings">
          </div>
    
          <div class="panel-content hidden" id="panel-notes">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="dropdown-menu hidden" id="save-menu" role="menu">
    <button type="button" data-action="pin" role="menuitem">
      <span class="menu-icon">📌</span>
      <span data-i18n="pin">固定</span>
    </button>
    <button type="button" data-action="copy" role="menuitem">
      <span class="menu-icon">📋</span>
      <span data-i18n="copy">复制</span>
    </button>
    <button type="button" data-action="rename" role="menuitem">
      <span class="menu-icon">✏</span>
      <span data-i18n="rename">重命名</span>
    </button>
    <button type="button" data-action="delete" role="menuitem" class="danger">
      <span class="menu-icon">🗑</span>
      <span data-i18n="delete">删除</span>
    </button>
  </div>
  
  <div class="modal-overlay hidden" id="delete-modal">
    <div class="modal">
      <h2 data-i18n="deleteSaveTitle">删除存档</h2>
      <p id="delete-message" data-i18n="deleteSaveMessage">是否确认删除该存档，该操作不可恢复</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-delete" data-i18n="cancel">取消</button>
        <button type="button" class="btn btn-danger" id="btn-confirm-delete" data-i18n="delete">删除</button>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay hidden" id="rename-modal">
    <div class="modal">
      <h2 data-i18n="renameSaveTitle">重命名游戏</h2>
      <input type="text" class="modal-input" id="rename-save-input" autocomplete="off">
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-rename" data-i18n="cancel">取消</button>
        <button type="button" class="btn btn-primary" id="btn-confirm-rename" data-i18n="modalSave">保存</button>
      </div>
    </div>
  </div>
  
  <div class="modal-overlay hidden" id="clear-consult-modal">
    <div class="modal">
      <p id="clear-consult-message" data-i18n="clearConsultMessage">确认清除所有的历史记录吗？</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel-clear-consult" data-i18n="cancel">取消</button>
        <button type="button" class="btn btn-danger" id="btn-confirm-clear-consult" data-i18n="clear">清除</button>
      </div>
    </div>
  </div>
  
  <div class="dropdown-menu hidden" id="account-options-menu" role="menu">
    <button type="button" data-action="switch-account" role="menuitem" data-i18n="switchAccount">账号管理</button>
    <button type="button" data-action="logout" role="menuitem" data-i18n="logout">退出登录</button>
  </div>

  <div class="account-overlay hidden" id="account-overlay">
    <div class="account-box" id="account-box" role="dialog" aria-modal="true">
      <button type="button" class="panel-close" id="btn-account-close" aria-label="关闭" data-i18n-aria="close">×</button>
      <div class="account-box-body" id="account-manage-body">
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/account.js"></script>
  <script src="js/account-menu.js"></script>
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/home.js"></script>
  <script src="js/chat-view.js"></script>
  <script src="js/save-list.js"></script>
  <script src="js/app.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
